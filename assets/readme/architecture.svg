  <text x="64" y="755" class="font-main" font-size="11.2" fill="#374151">• psycopg3 原生 HNSW 索引余弦相似度检索</text>
  <text x="64" y="776" class="font-main" font-size="11.2" fill="#374151">• 四维向量: TABLE / COLUMN / GLOSSARY / QA</text>
  <text x="64" y="797" class="font-main" font-size="11.2" fill="#374151">• 关系表: db_table / db_column / db_foreign_key</text>
  <text x="64" y="818" class="font-mono" font-size="10.2" fill="#DC2626">app/retrieval/retriever.py &amp; schema_store.py</text>

  <!-- Infra 2 -->
  <rect x="418" y="708" width="354" height="128" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.4"/>
  <text x="434" y="732" class="font-main" font-size="13" font-weight="700" fill="#B45309">三级只读 SQL 防线 (SQLGlot + SQLite)</text>
  <text x="434" y="755" class="font-main" font-size="11.2" fill="#374151">• 语法防线: SQLGlot AST 拦截 DROP/DELETE/UPDATE</text>
  <text x="434" y="776" class="font-main" font-size="11.2" fill="#374151">• 物理防线: SQLite URI (mode=ro) 物理只读连接</text>
  <text x="434" y="797" class="font-main" font-size="11.2" fill="#374151">• 预置 BIRD Benchmark 业务评测数据库</text>
  <text x="434" y="818" class="font-mono" font-size="10.2" fill="#D97706">app/graph/nodes/sql_execute.py</text>

