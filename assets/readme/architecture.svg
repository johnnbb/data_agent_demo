  <rect x="788" y="708" width="354" height="128" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
  <text x="804" y="732" class="font-main" font-size="13" font-weight="700" fill="#047857">Docker / Subprocess 双模隔离沙箱</text>
  <text x="804" y="755" class="font-main" font-size="11.2" fill="#374151">• 容器隔离优先，无 Docker 环境平滑降级子进程</text>
  <text x="804" y="776" class="font-main" font-size="11.2" fill="#374151">• stdin 标准输入安全传参，规避代码拼接注入</text>
  <text x="804" y="797" class="font-main" font-size="11.2" fill="#374151">• Pandas / NumPy 复杂统计与超时熔断保护</text>
