  <text x="1080" y="392" class="font-main" font-size="13" font-weight="700" fill="#5B21B6">闭环落地的 4 项数据与契约改造</text>

  <rect x="1080" y="404" width="420" height="36" rx="6" fill="#F5F3FF"/>
  <text x="1090" y="420" class="font-main" font-size="11.5" font-weight="700" fill="#4C1D95">① 低基数枚举只读采样 (table_relation.py)</text>
  <text x="1090" y="434" class="font-main" font-size="10.5" fill="#475569">mode=ro + 2s 超时注入 Examples: [...]，消除字面量大小写幻觉</text>

  <rect x="1080" y="446" width="420" height="36" rx="6" fill="#F5F3FF"/>
  <text x="1090" y="462" class="font-main" font-size="11.5" font-weight="700" fill="#4C1D95">② 业务口径检索窗口扩容 (evidence_recall.py)</text>
  <text x="1090" y="476" class="font-main" font-size="10.5" fill="#475569">search_glossary top_k: 4 → 8，避免复合问句挤掉次要口径规则</text>

